<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('ブログ閲覧')}"></head>

<body>
        <div th:replace="~{layout :: header}"></div>
    <div > 
      <h4>詳細画面</h4>
    <ul th:each="blog : ${blog}" class="name1">
     <li class="name2"> <p class="name">ユーザー名:</p><p  th:text="${blog.name}"></p></li>
      <li class="name2"><p class="name">タイトル:</p><p  th:text="${blog.title}"> </p></li>
      <li class="name2"><p class="name">内容:</p><p  th:text="${blog.notes}"></p></li>
    </ul>
      </div>
      
      <div class="name">
      <form th:action="@{/blog/{id}/delete(id=${blog.id})}" method="post">
  <button type="submit">削除</button>
</form>
      <button><a href="/blog">一覧へ戻る</button>
    </div>
    </body>
</html>
