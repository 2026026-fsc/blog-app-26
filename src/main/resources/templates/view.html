<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/style.css">
    <title>ブログ閲覧</title>
</head>
<body>
     <div>
        <ul class="style1">
             <form action="/blog" method="get">
            <input type="text" name="keyword"  class="text1"> 
                <input type="submit" value="検索" class="botton1">
            </form>
            <li><a href="/save" class="link1">✐投稿してみる</a></li>
            <li  ><a href="/login"  class="link2">ログイン</a></li>
            <li ><a href="/sign" ><input type="text" value="会員登録" class="text2"></a></li>
        </ul>
    </div>
    <div>
        <table>
          <tr><th>名前</th><th>タイトル</th><th>内容</th></tr>
    <tr th:each="blog : ${blog}">
      <td th:text="${blog.name}"></td>
      <td><span th:text="${blog.title}"></span></td>
      <td><span th:text="${blog.notes}"></span></td>
      </tr>
      </table>
      <a href="/blog"><input type="submit" value="ブログ一覧へ戻る"></a>
    </div>
    </body>
</html>
