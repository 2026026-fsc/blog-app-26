<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('投稿画面')}"></head>

<body>
    <div th:replace="~{layout :: header}"></div>

    <h2>投稿画面</h2>
    <div >
           <form action="/blog"  method="post" class="save">
            <label for="name">名前:</label>
            <input type="text" id="name" name="name" placeholder="名前を入力してください"><br>
            <label for="title">タイトル:</label>
            <input type="text" name="title" id="title" placeholder="入力してください"><br>
            <label for="notes">内容:</label>
            <textarea name="notes" id="notes" rows="8" placeholder="入力してください"></textarea><br>
            <button>投稿</button>
             </form>

            
             
             
    </div>
    </body>
</html>
